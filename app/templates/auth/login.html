{% extends "base.html" %}
{% block title %}Login — Reviews Monitor{% endblock %}
{% block content %}
<style>
    /* HF-003: Password toggle */
    .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }
    .password-wrapper input {
        padding-right: 48px;
    }
    .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--muted, #A1A1AA);
        cursor: pointer;
        padding: 4px;
        font-size: 16px;
        line-height: 1;
        transition: color 0.15s;
    }
    .password-toggle:hover {
        color: var(--text, #E4E4E7);
    }
    .password-toggle:focus-visible {
        outline: 2px solid var(--orange, #FF7A00);
        outline-offset: 2px;
        border-radius: 4px;
    }
</style>
<div class="auth-card">
    <h2>Login</h2>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
        <label>Password</label>
        <div class="password-wrapper">
            <input type="password" id="login-password" name="password" required>
            <button type="button" class="password-toggle" id="login-pw-toggle"
                    aria-label="Tampilkan password" title="Tampilkan password"
                    tabindex="0">👁</button>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="auth-link">Belum punya akun? <a href="/auth/register">Daftar</a></p>
</div>
<script>
(function() {
    var pwEl = document.getElementById('login-password');
    var pwToggle = document.getElementById('login-pw-toggle');
    if (pwEl && pwToggle) {
        pwToggle.addEventListener('click', function() {
            var isPassword = pwEl.type === 'password';
            pwEl.type = isPassword ? 'text' : 'password';
            pwToggle.textContent = isPassword ? '🙈' : '👁';
            pwToggle.setAttribute('aria-label', isPassword ? 'Sembunyikan password' : 'Tampilkan password');
            pwToggle.setAttribute('title', isPassword ? 'Sembunyikan password' : 'Tampilkan password');
        });
    }
})();
</script>
{% endblock %}
