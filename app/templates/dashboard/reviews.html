{% extends "base.html" %}
{% block title %}Reviews — GRM{% endblock %}
{% block content %}
<h1 style="font-size:20px;margin:0 0 4px">Reviews</h1>
<p style="color:var(--muted);font-size:14px;margin:0 0 16px">Lihat review publik bisnis Anda.</p>

<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
  <button class="btn btn-ghost tab active" data-sentiment="" onclick="setTab(this)">Semua</button>
  <button class="btn btn-ghost tab" data-sentiment="positive" onclick="setTab(this)">Positif</button>
  <button class="btn btn-ghost tab" data-sentiment="neutral" onclick="setTab(this)">Netral</button>
  <button class="btn btn-ghost tab" data-sentiment="negative" onclick="setTab(this)">Negatif</button>
  <span style="margin-left:auto;font-size:13px;color:var(--muted)">30 hari terakhir</span>
</div>

<div id="reviews-box" style="font-size:13px;color:var(--muted)">Memuat…</div>

<script>
let current = '';

async function setTab(btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  current = btn.dataset.sentiment;
  loadReviews();
}

async function loadReviews() {
  const box = document.getElementById('reviews-box');
  box.textContent = 'Memuat…';
  const params = new URLSearchParams({days: '30', per_page: '30'});
  if (current) params.set('sentiment', current);
  const r = await fetch('/api/public/analytics/explorer?' + params.toString());
  const data = await r.json();
  if (!data.items || !data.items.length) { box.textContent = 'Belum ada review pada filter ini.'; return; }
  box.innerHTML = data.items.map(it => {
    const dot = it.sentiment === 'positive' ? '#16a34a' : it.sentiment === 'negative' ? '#dc2626' : '#9ca3af';
    const stars = '★'.repeat(it.rating) + '☆'.repeat(5 - it.rating);
    return '<div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<span style="color:#f59e0b;font-size:13px">' + stars + '</span>' +
        '<span style="font-size:12px;color:var(--muted)">' + (it.reviewer || 'Anonim') + '</span>' +
        '<span style="width:8px;height:8px;border-radius:99px;background:' + dot + ';display:inline-block"></span>' +
        '<span style="margin-left:auto;font-size:12px;color:var(--muted)">' + (it.date ? it.date.slice(0,10) : '') + '</span>' +
      '</div>' +
      '<div style="font-size:14px;margin-top:6px">' + (it.snippet || '<em style="color:#9ca3af">rating only</em>') + '</div>' +
    '</div>';
  }).join('');
}

loadReviews();
</script>
{% endblock %}
