{% extends "base.html" %}
{% block title %}Login — Reviews Monitor{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Login</h2>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="auth-link">Belum punya akun? <a href="/auth/register">Daftar</a></p>
</div>
{% endblock %}
